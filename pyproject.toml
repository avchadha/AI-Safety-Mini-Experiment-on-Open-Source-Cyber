[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-cyber-log-detection"
version = "0.1.0"
description = "Reproducible log-based detection experiment for AI-generated cyber activity"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
]
real = [
  "inspect-ai>=0.3",
  "inspect-cyber>=0.1",
]

[project.scripts]
cyberdetect = "cyberdetect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberdetect"]

[tool.ruff]
line-length = 100
target-version = "py311"

